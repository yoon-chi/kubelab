kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: command-vault
nodes:
  - role: control-plane
  - role: worker
    extraMounts:
      - hostPath: ./data/worker1
        containerPath: /var/local-path-provisioner
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    labels:
      ingress-ready: "true"
  - role: worker
    extraMounts:
      - hostPath: ./data/worker2
        containerPath: /var/local-path-provisioner
